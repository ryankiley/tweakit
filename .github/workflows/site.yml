# Build the kit + docs site and run the tests on main pushes and PRs; deploy dist/ to
# GitHub Pages on main pushes only (skipped while the repo is private).
name: site

on:
  push:
    branches: [main]
  pull_request:
  # No release trigger: a release's tag sits on main's head, which the push above already
  # deployed, and the github-pages environment only takes deployments from main.
  workflow_dispatch:

permissions:
  contents: read

# Per ref: main's deploys queue one at a time; a PR's newer push cancels the run its older one started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check # Prettier, 120 columns: `npm run format` fixes it
      - run: node build.mjs # with maps, so a failing test's trace names source lines
      - run: node --enable-source-maps --test "test/*.test.mjs" # against the dist just built; the quoted glob skips the _helpers
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.event_name != 'pull_request' }} # the artifact only feeds the deploy job, which a PR run never reaches
        with:
          path: dist

  # Layout in a real browser: row heights, label insets, overflow and drag, which jsdom can't measure.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser download is cached by lockfile; the system libraries it needs are installed either way.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium # a cached browser skips the download; the system deps install either way
      - run: npm run test:browser # builds first

  deploy:
    needs: [build, browser] # a layout regression never deploys
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
