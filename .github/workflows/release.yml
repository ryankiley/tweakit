# Publish to npm when a v* tag is pushed, through npm trusted publishing: the job's OIDC token
# is the credential, so no npm token is stored anywhere, and npm attaches provenance by itself.
# It needs a trusted publisher on npmjs.com (tweakit → Settings → Trusted publishing) for this
# repository and this file, release.yml, allowed to run `npm publish`; and npm 11.5.1+.
# Release flow: bump the version, merge, publish a GitHub Release for vX.Y.Z; the tag must
# match package.json's version.
name: release

on:
  push:
    tags:
      - "v*"

# Read the tree, plus the OIDC token npm trades for a one-off publish credential.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # its npm is 11, the line trusted publishing needs
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # a release installs clean, never from a cache
      - name: Check npm is new enough for trusted publishing
        run: |
          NPM="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$NPM"; then
            echo "::error::npm $NPM is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi
      # A re-tag of an already-published version no-ops instead of failing on a duplicate publish.
      - name: Skip if already published
        id: check
        run: |
          if npm view "tweakit@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tweakit@${GITHUB_REF_NAME#v} is already published — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly rebuilds dist and runs the tests first; a red build never reaches the registry.
      - if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
