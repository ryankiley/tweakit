# Publish to npm with provenance when a v* tag is pushed (needs an NPM_TOKEN repo secret).
# Release flow: bump the version, commit, publish a GitHub Release for vX.Y.Z; the tag must
# match package.json's version.
name: release

on:
  push:
    tags:
      - "v*"

# Read the tree, plus the OIDC token npm uses to sign provenance.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org" # wires NODE_AUTH_TOKEN into .npmrc
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi
      # A re-tag of an already-published version no-ops instead of failing on a duplicate publish.
      - name: Skip if already published
        id: check
        run: |
          if npm view "tweakit@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tweakit@${GITHUB_REF_NAME#v} is already published — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly rebuilds dist and runs the tests first; a red build never reaches the registry.
      - if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
