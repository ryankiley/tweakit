<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="alternate" type="text/markdown" href="./{{slug}}.md" />
  <link rel="describedby" href="./llms.txt" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f1f1" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="https://ryankiley.github.io/tweakit/og.png" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1260" />
  <meta property="og:image:alt" content="The word Tweakit in large light-gray type, with the tweakit panel that styles it set over its center." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./tweaks.css" />
  <link rel="stylesheet" href="./site.css" />
{{preload}}
{{styles}}
</head>
<body>
  <header class="topbar">
    <button class="topbar-menu" type="button" aria-label="Menu" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <a class="topbar-brand" href="./index.html">Tweakit</a>
    {{versionLink}}
    <a class="topbar-gh" href="https://github.com/ryankiley/tweakit" rel="noopener" aria-label="View on GitHub" title="View on GitHub">{{github}}</a>
  </header>
  <div class="layout">
    <nav class="sb" aria-label="Site">
      <div class="sb-brand">
        <a href="./index.html">Tweakit</a>
        {{versionLink}}
        <a class="sb-gh" href="https://github.com/ryankiley/tweakit" rel="noopener" aria-label="View on GitHub" title="View on GitHub">{{github}}</a>
      </div>
{{nav}}
      <div class="sb-group"><div class="sb-section">Agents</div><a class="sb-link" href="./AGENTS.md" title="The guide for coding agents, as raw Markdown">AGENTS.md</a><a class="sb-link" href="./llms.txt" title="Every docs page as Markdown, for coding agents">llms.txt</a></div>
    </nav>
    <main class="doc{{docClass}}">
{{content}}
{{footnav}}
    </main>
  </div>
  <script src="./site.js" defer></script>
{{script}}
</body>
</html>
